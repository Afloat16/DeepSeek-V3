name: Validate FP8 preflight with pinned dependencies
on:
  push:
    branches: [validation/fp8-pinned-20260930]
permissions:
  contents: read
jobs:
  pinned-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 251da9f492a6837b632b2051e6e189ed8a494bd4
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned inference dependencies with CPU PyTorch
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r inference/requirements.txt pytest==8.3.5 tqdm==4.67.1
          python -m pip check
      - name: Record dependency versions
        run: |
          python - <<'PY'
          import torch, triton, transformers, safetensors, pytest
          print("torch:", torch.__version__)
          print("triton:", triton.__version__)
          print("transformers:", transformers.__version__)
          print("safetensors:", safetensors.__version__)
          print("pytest:", pytest.__version__)
          print("CUDA available:", torch.cuda.is_available())
          assert torch.__version__.split("+")[0] == "2.4.1"
          assert triton.__version__ == "3.0.0"
          assert transformers.__version__ == "4.46.3"
          assert safetensors.__version__ == "0.4.5"
          PY
      - name: Test the exact PR head with real safetensors CPU I/O
        run: python -m pytest -q inference/tests/test_fp8_scale_preflight.py -rs
      - name: Compare the same tests with original upstream
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          temp = Path(os.environ["RUNNER_TEMP"])
          original = temp / "fp8-original.py"
          original.write_bytes(subprocess.check_output(["git", "show", "9b4e9788e4a3a731f7567338ed15d3ec549ce03b:inference/fp8_cast_bf16.py"]))
          report = temp / "fp8-original-results.xml"
          env = dict(os.environ, FP8_CONVERTER_SOURCE=str(original), CPU_REGRESSION_ONLY="1")
          result = subprocess.run(["python", "-m", "pytest", "-q", "inference/tests/test_fp8_scale_preflight.py", "-rs", "--junitxml", str(report)], env=env)
          suite = ET.parse(report).getroot().find("testsuite")
          assert result.returncode == 1, "Original code should fail the regression assertions"
          assert int(suite.attrib["errors"]) == 0, suite.attrib
          assert int(suite.attrib["failures"]) > 0, suite.attrib
          names = [case.attrib["name"] for case in suite.findall("testcase") if case.find("failure") is not None]
          assert any(name.startswith("test_missing_scale_index_fails_before_writes") for name in names)
          assert "test_bad_later_shard_does_not_leave_earlier_outputs" in names
          print("Original pinned-environment comparison:", suite.attrib, flush=True)
          PY
      - name: Confirm submitted source and tests were not modified
        run: git diff --exit-code -- inference/fp8_cast_bf16.py inference/tests/test_fp8_scale_preflight.py
